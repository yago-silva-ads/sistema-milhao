<div class="toast-container" id="toastContainer"></div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay" style="display: none;">
  <div class="loading-content">
    <div class="loading-logo">
      <i class="ph-fill ph-crown"></i>
    </div>
    <h2 class="loading-text">Entrando no <span style="color: #00FF87;">Sistema</span>...</h2>
    <div class="loading-bar">
      <div class="loading-bar-fill"></div>
    </div>
    <p class="loading-sub">Preparando seu painel</p>
  </div>
</div>

<div class="login-wrapper">
  <div class="glow-blob-purple"></div>
  <div class="glow-blob-green"></div>

  <div class="login-card">
    <div class="login-header">
      <div class="logo-mark">
        <i class="ph-fill ph-crown"></i>
      </div>
      <h1>Sistema <span class="gradient-text">Milhão</span></h1>
      <p class="subtitle">Acesse sua conta para gerenciar seu negócio</p>
    </div>

    <div class="form-group">
      <label>Email</label>
      <div class="input-with-icon">
        <i class="ph ph-at"></i>
        <input type="email" [(ngModel)]="dadosLogin.login" placeholder="seu@email.com">
      </div>
    </div>

    <div class="form-group">
      <label>Senha</label>
      <div class="input-with-icon">
        <i class="ph ph-lock"></i>
        <input type="password" [(ngModel)]="dadosLogin.senha" placeholder="••••••">
      </div>
    </div>

    <button class="btn-enter" (click)="entrar()">
      <span>ENTRAR</span>
      <i class="ph ph-arrow-right"></i>
    </button>
    
    <div class="login-footer">
      <p>Não tem conta? <a href="/register"><strong>Crie grátis</strong></a></p>
    </div>
  </div>
</div>
