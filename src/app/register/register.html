<div class="toast-container" id="toastContainer"></div>

<div class="register-wrapper">
  
  <div class="glow-blob-purple" style="top: -100px; right: -100px;"></div>
  <div class="glow-blob-green" style="bottom: -100px; left: -100px;"></div>

  <div class="glass-card register-card">
    <div class="register-header">
      <h1 class="hero-title">Sistema <span class="gradient-text">Milhão</span></h1>
      <h2>Crie seu Perfil de Elite</h2>
      <p class="subtitle">Preencha e comece a faturar</p>
    </div>

    <form [formGroup]="cadastroForm" (ngSubmit)="onSubmit()" class="register-form">
      
      <div class="form-group">
        <label>Nome do Profissional</label>
        <div class="input-with-icon">
          <i class="ph ph-user"></i>
          <input type="text" formControlName="nome" placeholder="Seu Nome Completo" (input)="limparTexto($event)">
        </div>
      </div>
      
      <div class="form-group">
        <label>E-mail de Acesso</label>
        <div class="input-with-icon">
          <i class="ph ph-envelope"></i>
          <input type="email" formControlName="email" placeholder="seu@email.com">
        </div>
      </div>

      <div class="form-group">
        <label>Tipo de Serviço</label>
        <div class="input-with-icon">
          <i class="ph ph-briefcase"></i>
          <input type="text" formControlName="servico" placeholder="Ex: Barbeiro, Encanador, Coach" (input)="limparTexto($event)">
        </div>
      </div>

      <div class="form-group">
        <label>Valor do Serviço (R$)</label>
        <div class="input-with-icon">
          <i class="ph ph-currency-dollar"></i>
          <input type="number" formControlName="preco" placeholder="0.00" min="0" step="0.01" 
                 onkeypress="return ((event.charCode >= 48 && event.charCode <= 57) || event.charCode == 44 || event.charCode == 46);">
        </div>
      </div>

      <div class="form-group">
        <label>WhatsApp (DDD + Número)</label>
        <div class="input-with-icon">
          <i class="ph ph-whatsapp-logo"></i>
          <input type="tel" formControlName="linkWhatsapp" placeholder="11999999999" maxlength="11"
                 onkeypress="return event.charCode >= 48 && event.charCode <= 57;">
        </div>
        @if (cadastroForm.get('linkWhatsapp')?.invalid && cadastroForm.get('linkWhatsapp')?.touched) {
          <small class="error-text">
            Apenas números (DDD + Telefone). Sem traços ou espaços.
          </small>
        }
      </div>

      <button type="submit" class="btn-primary-solid btn-full" (click)="onSubmit()" [disabled]="!cadastroForm.valid" [style.opacity]="!cadastroForm.valid ? '0.5' : '1'">
        CADASTRAR
      </button>

      <div class="register-footer">
        <a href="/login" class="link-login">Já tem conta? <span>Entrar</span></a>
      </div>
    </form>
  </div>

  <section class="dashboard-section" *ngIf="false">
    <div *ngFor="let item of listaDeMetas">
       <button (click)="excluir(item.id)">✕</button>
    </div>
  </section>
</div>
