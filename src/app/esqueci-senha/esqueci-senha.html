<div class="toast-container" id="toastContainer"></div>

<div class="reset-wrapper">
  <div class="glow-blob-purple"></div>
  <div class="glow-blob-green"></div>

  <div class="reset-card">
    <div class="reset-header">
      <div class="logo-mark">
        <i class="ph-fill ph-lock-key"></i>
      </div>
      <h1>Recuperar <span class="gradient-text">Senha</span></h1>
    </div>

    <!-- STEP 1: Email -->
    <div *ngIf="step === 'email'">
      <p class="subtitle">Digite seu e-mail para receber o código de recuperação</p>
      <div class="form-group">
        <label>Email cadastrado</label>
        <div class="input-with-icon">
          <i class="ph ph-at"></i>
          <input type="email" [(ngModel)]="email" placeholder="seu@email.com">
        </div>
      </div>
      <button class="btn-enter" (click)="enviarCodigo()" [disabled]="loading || !email">
        <span>{{ loading ? 'ENVIANDO...' : 'ENVIAR CÓDIGO' }}</span>
        <i class="ph ph-paper-plane-tilt"></i>
      </button>
    </div>

    <!-- STEP 2: Código -->
    <div *ngIf="step === 'codigo'">
      <p class="subtitle">Digite o código de 6 dígitos enviado para <strong>{{ email }}</strong></p>
      <div class="form-group">
        <label>Código de verificação</label>
        <div class="input-with-icon">
          <i class="ph ph-shield-check"></i>
          <input type="text" [(ngModel)]="codigo" placeholder="000000" maxlength="6" class="code-input">
        </div>
      </div>
      <button class="btn-enter" (click)="validarCodigo()" [disabled]="codigo.length !== 6">
        <span>CONTINUAR</span>
        <i class="ph ph-arrow-right"></i>
      </button>
    </div>

    <!-- STEP 3: Nova senha -->
    <div *ngIf="step === 'nova-senha'">
      <p class="subtitle">Crie sua nova senha</p>
      <div class="form-group">
        <label>Nova senha</label>
        <div class="input-with-icon">
          <i class="ph ph-lock"></i>
          <input type="password" [(ngModel)]="novaSenha" placeholder="Mínimo 6 caracteres">
        </div>
      </div>
      <button class="btn-enter" (click)="resetarSenha()" [disabled]="loading || novaSenha.length < 6">
        <span>{{ loading ? 'SALVANDO...' : 'SALVAR NOVA SENHA' }}</span>
        <i class="ph ph-check"></i>
      </button>
    </div>

    <div class="reset-footer">
      <a href="/login">← Voltar para o login</a>
    </div>
  </div>
</div>
